name: Connect Cloud PC to Termux
on:
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Tailscale Connect (Direct Key)
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: tskey-auth-kjXQdcNhEi11CNTRL-VoZYvwk2Wg1E1JSquCm4g1XcbhngyuzvZ

      # 2. SSH Server chalu kora o Tailscale IP dekha
      - name: Enable SSH
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          echo "root:password123" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          echo "========================================="
          echo "Cloud PC Ready! Your Tailscale IP is:"
          tailscale ip -4
          echo "========================================="
          sleep 4h
